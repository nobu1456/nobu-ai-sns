<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySNS - 自作SNSプロジェクト</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-white shadow sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">MySNS</h1>
            <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">LocalStorage動作中</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-2xl mx-auto px-4 py-6">

        <!-- 投稿入力エリア -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <textarea 
                id="postInput"
                class="w-full border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" 
                rows="3" 
                placeholder="いま何してる？"></textarea>
            <div class="flex justify-end mt-2">
                <button 
                    id="postBtn"
                    class="bg-blue-500 text-white px-5 py-2 rounded-full font-semibold text-sm hover:bg-blue-600 transition">
                    投稿する
                </button>
            </div>
        </div>

        <!-- タイムライン (投稿一覧) -->
        <div id="timeline" class="space-y-4">
            <!-- JavaScriptでここに投稿カードが挿入されます -->
        </div>

    </main>

    <!-- JavaScript 処理 -->
    <script>
        const postBtn = document.getElementById('postBtn');
        const postInput = document.getElementById('postInput');
        const timeline = document.getElementById('timeline');

        // ローカルストレージから投稿を取得（データがなければ空配列）
        let posts = JSON.parse(localStorage.getItem('my_sns_posts')) || [
            {
                id: Date.now(),
                user: '開発者ユーザー',
                content: '自作SNSの開発をスタートしました！LocalStorage対応版です。',
                createdAt: new Date().toLocaleString('ja-JP')
            }
        ];

        // 画面に投稿一覧を描画する関数
        function renderPosts() {
            timeline.innerHTML = ''; // 一旦クリア

            if (posts.length === 0) {
                timeline.innerHTML = '<p class="text-center text-gray-500 text-sm">投稿がまだありません。</p>';
                return;
            }

            posts.forEach(post => {
                const postEl = document.createElement('div');
                postEl.className = 'bg-white p-4 rounded-lg shadow relative group';
                postEl.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">
                                ${post.user.charAt(0)}
                            </div>
                            <div>
                                <div class="font-bold text-gray-800 text-sm">${post.user}</div>
                                <div class="text-xs text-gray-500">${post.createdAt}</div>
                            </div>
                        </div>
                        <button 
                            onclick="deletePost(${post.id})" 
                            class="text-xs text-red-400 hover:text-red-600 opacity-80 hover:opacity-100">
                            削除
                        </button>
                    </div>
                    <p class="text-gray-700 text-sm whitespace-pre-wrap">${escapeHtml(post.content)}</p>
                `;
                timeline.appendChild(postEl);
            });
        }

        // XSS対策のためのエスケープ関数
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&")
                .replace(/</g, "<")
                .replace(/>/g, ">")
                .replace(/"/g, """)
                .replace(/'/g, "'");
        }

        // 新規投稿処理
        postBtn.addEventListener('click', () => {
            const content = postInput.value.trim();
            if (!content) return;

            const newPost = {
                id: Date.now(),
                user: 'あなた',
                content: content,
                createdAt: new Date().toLocaleString('ja-JP')
            };

            // 配列の先頭に追加
            posts.unshift(newPost);

            // LocalStorageに保存
            savePosts();

            // 画面更新と入力欄初期化
            renderPosts();
            postInput.value = '';
        });

        // 投稿削除処理
        function deletePost(id) {
            posts = posts.filter(post => post.id !== id);
            savePosts();
            renderPosts();
        }

        // LocalStorageへの保存共通処理
        function savePosts() {
            localStorage.setItem('my_sns_posts', JSON.stringify(posts));
        }

        // 初期表示
        renderPosts();
    </script>
</body>
</html>
