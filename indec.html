<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySNS - 自作SNSプロジェクト</title>
    <!-- Tailwind CSS (デザイン調整用ライブラリ) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-white shadow sticky top-0 z-10">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">MySNS</h1>
            <button class="bg-blue-500 text-white px-4 py-1.5 rounded-full text-sm hover:bg-blue-600">
                ログイン
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-2xl mx-auto px-4 py-6">

        <!-- 投稿入力エリア -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <textarea 
                id="postInput"
                class="w-full border rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" 
                rows="3" 
                placeholder="いま何してる？"></textarea>
            <div class="flex justify-end mt-2">
                <button 
                    id="postBtn"
                    class="bg-blue-500 text-white px-5 py-2 rounded-full font-semibold text-sm hover:bg-blue-600">
                    投稿する
                </button>
            </div>
        </div>

        <!-- タイムライン (投稿一覧) -->
        <div id="timeline" class="space-y-4">
            
            <!-- サンプル投稿 1 -->
            <div class="bg-white p-4 rounded-lg shadow">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-10 h-10 bg-blue-400 rounded-full flex items-center justify-center text-white font-bold">
                        U
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-sm">開発者ユーザー</div>
                        <div class="text-xs text-gray-500">たった今</div>
                    </div>
                </div>
                <p class="text-gray-700 text-sm">
                    自作SNSの開発をスタートしました！まずはHTMLとCSSで画面の骨組みを作成中です。
                </p>
            </div>

            <!-- サンプル投稿 2 -->
            <div class="bg-white p-4 rounded-lg shadow">
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-10 h-10 bg-green-400 rounded-full flex items-center justify-center text-white font-bold">
                        G
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-sm">ゲスト</div>
                        <div class="text-xs text-gray-500">1時間前</div>
                    </div>
                </div>
                <p class="text-gray-700 text-sm">
                    ここにみんなの投稿が並ぶ予定です。
                </p>
            </div>

        </div>

    </main>

    <!-- 簡単な JavaScript 処理（動作テスト用） -->
    <script>
        const postBtn = document.getElementById('postBtn');
        const postInput = document.getElementById('postInput');
        const timeline = document.getElementById('timeline');

        // 投稿ボタンクリック時の処理
        postBtn.addEventListener('click', () => {
            const content = postInput.value.trim();
            if (!content) return;

            // 新しい投稿要素を作成
            const newPost = document.createElement('div');
            newPost.className = 'bg-white p-4 rounded-lg shadow';
            newPost.innerHTML = `
                <div class="flex items-center space-x-3 mb-2">
                    <div class="w-10 h-10 bg-purple-400 rounded-full flex items-center justify-center text-white font-bold">
                        You
                    </div>
                    <div>
                        <div class="font-bold text-gray-800 text-sm">あなた</div>
                        <div class="text-xs text-gray-500">たった今</div>
                    </div>
                </div>
                <p class="text-gray-700 text-sm">${content}</p>
            `;

            // タイムラインの先頭に追加
            timeline.prepend(newPost);

            // 入力欄をクリア
            postInput.value = '';
        });
    </script>
</body>
</html>
